<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Command Centre{% endblock %}</title>
<style>
  :root{
    --page:#f6f7f8; --card:#fff; --line:#e2e6e9; --ink:#14181b; --dim:#5c666e; --accent:#1d6b8a;
    --open:#5b6d7a; --doing:#1d6b8a; --blocked:#9a5b18; --done:#2f6b45; --bad:#9b3e31; --badsoft:#f6e6e2;
  }
  @media (prefers-color-scheme:dark){
    :root{ --page:#101315; --card:#181c1f; --line:#282e33; --ink:#e8ecee; --dim:#95a0a8; --accent:#59b6d6;
           --open:#8fa2ad; --doing:#59b6d6; --blocked:#d5a05a; --done:#6fbb8e; --bad:#e08a7c; --badsoft:#2e1b18; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:0 20px 60px}
  .wrap{max-width:1200px;margin:0 auto}
  header{padding:32px 0 0;border-bottom:1px solid var(--line);
         display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
  h1{margin:0 0 14px;font-size:22px;letter-spacing:-.02em}
  nav{display:flex;gap:2px}
  nav a{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;
        color:var(--dim);text-decoration:none;padding:8px 12px 12px;border-bottom:2px solid transparent;margin-bottom:-1px}
  nav a.on{color:var(--ink);border-bottom-color:var(--accent)}
  nav a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
  .count{font:12px ui-monospace,Menlo,monospace;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;padding-bottom:14px}
  main{padding-top:22px}
  .mono{font:11px ui-monospace,Menlo,monospace;color:var(--dim)}
  .dot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
  form{margin:0}
  input,select,textarea,button{font:inherit}
  input[type=text],input[type=date],input[type=file]{width:100%;padding:8px 10px;border:1px solid var(--line);
      border-radius:5px;background:var(--card);color:var(--ink)}
  input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--dim)}
  .btn{padding:9px 16px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:5px;
       cursor:pointer;font-weight:600;font-size:14px}
  .btn.quiet{background:transparent;color:var(--accent)}
  .note{border-left:3px solid var(--blocked);padding:10px 14px;font-size:13.5px;color:var(--dim);
        background:var(--card);border-radius:0 5px 5px 0}
  .note.bad{border-left-color:var(--bad);background:var(--badsoft);color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Command Centre</h1>
      {% if user %}
      <nav>
        <a href="/ingest" class="{{ 'on' if tab == 'ingest' else '' }}">Ingest</a>
        <a href="/" class="{{ 'on' if tab == 'tasks' else '' }}">Tasks</a>
        <a href="/ask" class="{{ 'on' if tab == 'ask' else '' }}">Ask Claude</a>
        <a href="/settings" class="{{ 'on' if tab == 'settings' else '' }}">Settings</a>
        <a href="/docs" target="_blank" rel="noopener">API ↗</a>
      </nav>
      {% endif %}
    </div>
    <div style="display:flex;align-items:flex-end;gap:16px">
      {% block headright %}{% endblock %}
      {% if user %}
      <form method="post" action="/logout" style="padding-bottom:14px;display:flex;align-items:center;gap:10px">
        <span class="mono">{{ user.name }}</span>
        <button class="btn quiet" type="submit" style="padding:4px 9px;font-size:11px">Sign out</button>
      </form>
      {% endif %}
    </div>
  </header>
  <main>{% block main %}{% endblock %}</main>
</div>
</body>
</html>
