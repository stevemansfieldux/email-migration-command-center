# Create the app at https://api.slack.com/apps → "From an app manifest",
# paste this in, install to the workspace, then put the bot token and signing
# secret into the deployment's environment.
display_information:
  name: Command Centre
  description: Watches the channel and turns decisions into tasks.
  background_color: "#14181b"
features:
  bot_user:
    display_name: Command Centre
    always_online: true
oauth_config:
  scopes:
    bot:
      - channels:history
      - channels:read
      - chat:write
      - groups:history
      - groups:read
      - users:read
settings:
  event_subscriptions:
    # Replace with the deployed host once Railway gives you one.
    request_url: https://REPLACE-ME/slack/events
    bot_events:
      - message.channels
      - message.groups
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
